<ul class="pagination">
  <li class="page-item page-prev{% unless paginator.previous_page %} disabled{% endunless %}">
    <a{% if paginator.previous_page %} href="{{ paginator.previous_page_path | relative_url }}"{% else %} aria-disabled="true" tabindex="-1"{% endif %}>
      <div class="page-item-subtitle">Previous</div>
    </a>
  </li>

  <li class="page-item page-next{% unless paginator.next_page %} disabled{% endunless %}">
    <a{% if paginator.next_page %} href="{{ paginator.next_page_path | relative_url }}" class="next"{% else %} aria-disabled="true" tabindex="-1"{% endif %}>
      <div class="page-item-subtitle">Next</div>
    </a>
  </li>
</ul>
